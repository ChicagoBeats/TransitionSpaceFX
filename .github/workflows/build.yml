name: Build VST3 (Windows)
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: TransitionSpaceFX-VST3
          path: build/TransitionSpaceFX_artefacts/Release/VST3/
          if-no-files-found: error
      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: TransitionSpaceFX-Standalone
          path: build/TransitionSpaceFX_artefacts/Release/Standalone/

